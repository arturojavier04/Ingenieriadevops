
name: EP2 - Pipeline CI/CD ms-producto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-producto

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-producto/pom.xml

      - name: Ejecutar pruebas y construir JAR
        run: mvn -B -ntp clean verify

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-junit
          path: ms-producto/target/surefire-reports/
          if-no-files-found: ignore

  despliegue:
    name: Despliegue simulado con Docker
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-producto

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Comprobar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir imagen Docker
        run: |
          docker build \
            -t ms-producto:ep2 \
            -t ms-producto:${{ github.sha }} .

      - name: Crear credenciales temporales
        run: |
          echo "MYSQL_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"

      - name: Desplegar contenedores
        run: docker compose up -d --no-build

      - name: Comprobar servicios
        run: docker compose ps

      - name: Verificar respuesta de la API
        run: |
          for intento in {1..30}; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8083/api/productos || true)

            if [ "$codigo" = "200" ]; then
              echo "API funcionando correctamente: HTTP 200"
              exit 0
            fi

            echo "Esperando API. Intento $intento"
            sleep 3
          done

          echo "ERROR: La API no respondió correctamente"
          exit 1

      - name: Mostrar registros si hay errores
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80

      - name: Detener contenedores
        if: always()
        run: docker compose down --remove-orphans
