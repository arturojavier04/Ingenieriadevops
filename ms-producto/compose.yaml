
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: producto_db
      MYSQL_USER: producto_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ms-producto:
    build: .
    image: ms-producto:ep2
    cpus: "1.0"
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/producto_db
      SPRING_DATASOURCE_USERNAME: producto_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure:3

volumes:
  mysql_data:
